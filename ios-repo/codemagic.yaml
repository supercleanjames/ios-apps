workflows:
  creative-music-nexus:
    name: Creative Music Nexus
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jameswilliams.creativemusic
      vars:
        XCODE_PROJECT: "CreativeMusicNexus.xcodeproj"
        XCODE_SCHEME: "CreativeMusicNexus"
        BUNDLE_ID: "com.jameswilliams.creativemusic"
      xcode: 15.4
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Build and archive
        script: |
          cd apps/CreativeMusicNexus
          xcode-build-number set $BUILD_NUMBER $XCODE_PROJECT $XCODE_SCHEME
          xcode-project use-profiles
          xcodebuild -project $XCODE_PROJECT \
            -scheme $XCODE_SCHEME \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/CreativeMusicNexus.xcarchive \
            archive | xcpretty
          xcodebuild -exportArchive \
            -archivePath build/CreativeMusicNexus.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/
    artifacts:
      - apps/CreativeMusicNexus/build/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

