workflows:
  creative-music-nexus:
    name: Creative Music Nexus
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore-credentials
      vars:
        XCODE_PROJECT: "CreativeMusicNexus.xcodeproj"
        XCODE_SCHEME: "CreativeMusicNexus"
        BUNDLE_ID: "com.jrwtech.creativemusicnexus"
        APP_STORE_APPLE_ID: "6785688482"
      xcode: 26.4
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: Set build number
        script: |
          cd ios-repo/apps/CreativeMusicNexus
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          MAX=0
          for N in "$TF" "$AS"; do
            case "$N" in ''|*[!0-9]*) N=0;; esac
            [ "$N" -gt "$MAX" ] && MAX="$N"
          done
          NEXT=$((MAX + 1))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" CreativeMusicNexus/Info.plist
          echo "Uploading build $NEXT"
      - name: Build IPA
        script: |
          cd ios-repo/apps/CreativeMusicNexus
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios-repo/apps/CreativeMusicNexus/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

