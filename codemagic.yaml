workflows:
  creative-music-nexus:
    name: Creative Music Nexus
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jameswilliams.creativemusic
      groups:
        - appstore-credentials
      vars:
        XCODE_PROJECT: "CreativeMusicNexus.xcodeproj"
        XCODE_SCHEME: "CreativeMusicNexus"
        BUNDLE_ID: "com.jameswilliams.creativemusic"
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Build IPA
        script: |
          cd ios-repo/apps/CreativeMusicNexus
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios-repo/apps/CreativeMusicNexus/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

