workflows:
  creative-music-nexus:
    name: Creative Music Nexus
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore-credentials
      vars:
        XCODE_PROJECT: "CreativeMusicNexus.xcodeproj"
        XCODE_SCHEME: "CreativeMusicNexus"
        BUNDLE_ID: "com.jameswilliams.creativemusic"
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd ios-repo/apps/CreativeMusicNexus
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios-repo/apps/CreativeMusicNexus/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

